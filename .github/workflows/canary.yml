name: Canary

# Runs the shared config against public projects on pull requests, on pushes to
# main, and weekly. The stable pass must stay green. The pending and preview
# passes are reports: they show what the next release would change, so they are
# posted as a comment rather than failing the run. Pull requests get the comment
# on the PR. Pushes to main post to the tracking issue (#2). Other pushes are
# not reported.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    name: Canary (${{ matrix.repo }})
    strategy:
      fail-fast: false
      matrix:
        repo:
          - joe-sharp/boondoc
          - joe-sharp/mtg_card_maker
          - joe-sharp/guard-status
    env:
      # Bundler uses this repo's Gemfile, so every canary run resolves the newest
      # rubocop allowed by the gemspec, including new minor releases.
      BUNDLE_GEMFILE: ${{ github.workspace }}/shared/Gemfile
    steps:
      - uses: actions/checkout@v7
        with:
          path: shared
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
          path: target
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Install shared config
        working-directory: shared
        run: bundle install
      - name: Write canary config
        working-directory: target
        run: |
          printf 'inherit_from: ../shared/config/default.yml\n' > .rubocop-canary.yml
      - name: Run passes
        id: run
        working-directory: target
        run: |
          set +e
          out="$RUNNER_TEMP/canary"
          mkdir -p "$out"
          bundle exec rubocop -c .rubocop-canary.yml --format json --out "$out/stable.json"; echo $? > "$out/stable.rc"
          bundle exec rubocop -c .rubocop-canary.yml --enable-pending-cops --format json --out "$out/pending.json"; echo $? > "$out/pending.rc"
          bundle exec rubocop -c .rubocop-canary.yml --preview --format json --out "$out/preview.json"; echo $? > "$out/preview.rc"
      - name: Build report
        if: always()
        run: |
          out="$RUNNER_TEMP/canary"
          report="$RUNNER_TEMP/report-${{ strategy.job-index }}.md"
          valid() { jq -e . "$1" >/dev/null 2>&1; }
          count() {
            if valid "$1"; then jq -r '.summary.offense_count' "$1"; else echo "not run"; fi
          }
          by_cop() {
            jq -r '[.files[].offenses[].cop_name] | group_by(.) | map("- `\(.[0])`: \(length)") | .[]' "$1"
          }
          # Offenses in a pass beyond the stable pass, per cop.
          new_by_cop() {
            jq -r --slurpfile base "$out/stable.json" '
              def counts: [.files[].offenses[].cop_name] | group_by(.) | map({key: .[0], value: length}) | from_entries;
              (counts) as $now | ($base[0] | counts) as $old
              | $now | to_entries[]
              | select(.value > ($old[.key] // 0))
              | "- `\(.key)`: +\(.value - ($old[.key] // 0))"
            ' "$1"
          }
          {
            echo "### ${{ matrix.repo }}"
            echo
            if [ "$(cat "$out/stable.rc" 2>/dev/null)" = "0" ]; then
              echo "- **Stable:** passed"
            else
              echo "- **Stable:** **failed**"
            fi
            stable=$(count "$out/stable.json")
            for pass in pending preview; do
              if valid "$out/stable.json" && valid "$out/$pass.json"; then
                diff=$(( $(count "$out/$pass.json") - stable ))
                echo "- **${pass^}:** $(printf '%+d' "$diff") offenses vs stable"
              else
                echo "- **${pass^}:** not run"
              fi
            done
            echo
            for pass in stable pending preview; do
              echo "<details><summary>$pass cops</summary>"
              echo
              if ! valid "$out/$pass.json"; then
                echo "not run"
              elif [ "$pass" = stable ]; then
                by_cop "$out/stable.json"
              elif valid "$out/stable.json"; then
                new_by_cop "$out/$pass.json"
              else
                echo "not run"
              fi
              echo
              echo "</details>"
              echo
            done
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-${{ strategy.job-index }}
          path: ${{ runner.temp }}/report-${{ strategy.job-index }}.md
      - name: Fail on stable offenses
        run: test "$(cat "$RUNNER_TEMP/canary/stable.rc")" = "0"

  report:
    needs: canary
    if: always()
    runs-on: ubuntu-latest
    name: Post canary report
    permissions:
      issues: write
      pull-requests: write
    # Serialize posts so overlapping runs do not interleave or drop comments.
    concurrency:
      group: canary-report
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: 2
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: canary-*
          path: reports
          merge-multiple: true
      - name: Build comment body
        run: |
          body="$RUNNER_TEMP/body.md"
          {
            echo "Canary run [#${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo
            cat reports/*.md
          } > "$body"
      # Fork pull requests get a read-only token, so this step fails for them.
      # The report is still in the run's step summary.
      - name: Comment on pull request
        if: github.event_name == 'pull_request'
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/body.md"
      - name: Comment on tracking issue
        if: github.ref == 'refs/heads/main'
        run: gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/body.md"
