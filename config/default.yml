plugins:
  - rubocop-performance
  - rubocop-rspec

AllCops:
  NewCops: pending
  SuggestExtensions: false
  Exclude:
    - 'spec/fixtures/**/*'
    - 'vendor/**/*'
    - 'tmp/**/*'

# Pending cops are enabled per department. A version value enables pending
# cops added in that version or earlier; cops added after it stay pending.
Bundler:
  NewCops: '1.92'
Gemspec:
  NewCops: '1.92'
Layout:
  NewCops: '1.92'
Lint:
  NewCops: '1.92'
Metrics:
  NewCops: '1.92'
Migration:
  NewCops: '1.92'
Naming:
  NewCops: '1.92'
# rubocop-performance plugin
Performance:
  NewCops: '1.24'
# rubcop-rspec plugin
RSpec:
  NewCops: '3.10'
Security:
  NewCops: '1.92'
Style:
  NewCops: '1.92'
# End NewCops overrides

Layout/EndOfLine:
  EnforcedStyle: lf

Layout/HashAlignment:
  EnforcedHashRocketStyle:
    - key
    - table
  EnforcedColonStyle:
    - key
    - table

Metrics/BlockLength:
  AllowedMethods:
    - describe
    - context
    - shared_examples
    - shared_content
  CountAsOne:
    - array
    - hash
    - heredoc
    - method_call

Metrics/ClassLength:
  CountAsOne:
    - array
    - hash
    - heredoc
    - method_call

Metrics/MethodLength:
  CountAsOne:
    - array
    - hash
    - heredoc
    - method_call

Metrics/ModuleLength:
  CountAsOne:
    - array
    - hash
    - heredoc
    - method_call

Metrics/ParameterLists:
  CountKeywordArgs: false

# Allow underscore to indicate private variable.
Naming/MemoizedInstanceVariableName:
  EnforcedStyleForLeadingUnderscores: optional

Performance/RedundantMerge:
  MaxKeyValuePairs: 1

RSpec/ExampleLength:
  CountAsOne:
    - array
    - hash
    - heredoc
    - method_call

RSpec/NestedGroups:
  Max: 4

RSpec/MultipleMemoizedHelpers:
  Enabled: false

Style/Alias:
  EnforcedStyle: prefer_alias_method

Style/FormatStringToken:
  Enabled: false

Style/Lambda:
  Enabled: false

Style/SymbolArray:
  MinSize: 3

Style/WordArray:
  MinSize: 3
